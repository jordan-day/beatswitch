<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeatSwitch: make lo-fi beats in your browser</title>
    <meta name="description" content="Drums, chords and melody that fit together, then a whole song. Free, nothing to install." />
    <meta name="theme-color" content="#1a171e" />

    <!-- The preview card when a link is shared (messages, social apps). Apps read these from the HTML
         without running the app, so they're written here, with full addresses (relative ones aren't followed).
         The image's source is scripts/og-image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeatSwitch" />
    <meta property="og:title" content="BeatSwitch: make lo-fi beats in your browser" />
    <meta property="og:description" content="Drums, chords and melody that fit together, then a whole song. Free, nothing to install." />
    <meta property="og:url" content="https://jordan-day.github.io/beatswitch/" />
    <meta property="og:image" content="https://jordan-day.github.io/beatswitch/preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BeatSwitch: a drum pad, chords and a melody, with a big play button" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeatSwitch: make lo-fi beats in your browser" />
    <meta name="twitter:description" content="Drums, chords and melody that fit together, then a whole song. Free, nothing to install." />
    <meta name="twitter:image" content="https://jordan-day.github.io/beatswitch/preview.png" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>" />
  </head>
